<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCraft v0.1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: #87CEEB;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    #debug-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
      line-height: 1.6;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
    }
    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }
    #crosshair::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }
    #crosshair::after {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }
    #hotbar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
    }
    .hotbar-slot {
      width: 60px;
      height: 60px;
      background: rgba(0,0,0,0.5);
      border: 2px solid #888;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }
    .hotbar-slot.active {
      border-color: white;
      background: rgba(255,255,255,0.2);
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      pointer-events: all;
    }
    #instructions h2 {
      margin-bottom: 20px;
    }
    #instructions ul {
      list-style: none;
      margin: 20px 0;
      text-align: left;
    }
    #instructions li {
      margin: 8px 0;
    }
    #instructions button {
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #instructions button:hover {
      background: #45a049;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay">
    <div id="debug-overlay">
      <div>FPS: <span id="fps">0</span></div>
      <div>Position: <span id="position">0, 0, 0</span></div>
      <div>Selected: <span id="selected-block">None</span></div>
      <div>Hotbar: <span id="hotbar-index">1</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="hotbar">
      <div class="hotbar-slot active" data-index="0">DIRT<br/>1</div>
      <div class="hotbar-slot" data-index="1">GRASS<br/>2</div>
      <div class="hotbar-slot" data-index="2">STONE<br/>3</div>
    </div>
    <div id="instructions">
      <h2>MindCraft v0.1</h2>
      <ul>
        <li><strong>WASD</strong> - Move</li>
        <li><strong>Space</strong> - Jump</li>
        <li><strong>Mouse</strong> - Look around</li>
        <li><strong>Left Click</strong> - Break block</li>
        <li><strong>Right Click</strong> - Place block</li>
        <li><strong>1/2/3</strong> - Select block type</li>
        <li><strong>ESC</strong> - Release mouse</li>
      </ul>
      <button id="start-button">Click to Start</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
