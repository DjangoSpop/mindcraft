<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindCraft v0.2 - Shooter Edition</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      overflow: hidden;
      font-family: 'Courier New', monospace;
      background: #87CEEB;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    #debug-overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 16px;
      line-height: 1.8;
      background: rgba(0,0,0,0.6);
      padding: 15px;
      border-radius: 8px;
    }
    .stat-label {
      color: #aaa;
      margin-right: 8px;
    }
    .stat-value {
      color: #fff;
      font-weight: bold;
    }
    .health-bar {
      width: 200px;
      height: 20px;
      background: rgba(255,0,0,0.3);
      border: 2px solid #fff;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 5px;
    }
    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0000, #00ff00);
      transition: width 0.3s;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
    }
    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }
    #crosshair::before {
      top: 50%;
      left: 0;
      width: 100%;
      height: 2px;
      transform: translateY(-50%);
    }
    #crosshair::after {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      pointer-events: all;
    }
    #game-over h2 {
      color: #ff0000;
      font-size: 48px;
      margin-bottom: 20px;
    }
    #game-over p {
      font-size: 24px;
      margin: 10px 0;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      pointer-events: all;
    }
    #instructions h2 {
      margin-bottom: 20px;
    }
    #instructions ul {
      list-style: none;
      margin: 20px 0;
      text-align: left;
    }
    #instructions li {
      margin: 8px 0;
    }
    #instructions button {
      margin-top: 20px;
      padding: 10px 30px;
      font-size: 16px;
      cursor: pointer;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #instructions button:hover {
      background: #45a049;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay">
    <div id="debug-overlay">
      <div><span class="stat-label">FPS:</span><span class="stat-value" id="fps">0</span></div>
      <div><span class="stat-label">Health:</span><span class="stat-value" id="health">100%</span></div>
      <div><span class="stat-label">Score:</span><span class="stat-value" id="score">0</span></div>
      <div><span class="stat-label">Enemies:</span><span class="stat-value" id="enemy-count">0</span></div>
    </div>
    <div id="crosshair"></div>
    <div id="game-over" class="hidden">
      <h2>GAME OVER</h2>
      <p>Final Score: <span id="final-score">0</span></p>
      <p>Reload the page to play again</p>
    </div>
    <div id="instructions">
      <h2>MindCraft Shooter</h2>
      <ul>
        <li><strong>WASD</strong> - Move around</li>
        <li><strong>Space</strong> - Jump</li>
        <li><strong>Mouse</strong> - Rotate / Aim</li>
        <li><strong>Left Click</strong> - Shoot laser</li>
        <li><strong>ESC</strong> - Release mouse</li>
      </ul>
      <p style="margin-top: 15px; color: #ffaa00;">Shoot the spiders before they get you!</p>
      <button id="start-button">Click to Start</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
